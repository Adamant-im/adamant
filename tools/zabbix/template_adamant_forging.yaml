zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e74c1d3e5a9a4b2d8f6a2f31a6b0011
      name: Templates/Applications
  templates:
    - uuid: 8f1a4d9c73e94fdd9a8d6f9e2bd40011
      template: ADAMANT Node forging by Zabbix agent
      name: ADAMANT Node forging by Zabbix agent
      groups:
        - name: Templates/Applications
      items:
        - uuid: 06ab7e1d6bd14a3b9f5ea3d942aa0011
          name: 'ADAMANT forging: Status payload'
          type: ZABBIX_ACTIVE
          key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          delay: 1m
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Machine-readable local forging state. Delegate identities are not included.'
          tags:
            - tag: component
              value: forging
          triggers:
            - uuid: 06a91b4f5fd24b0c9ca4bf1c2a670011
              expression: 'nodata(/ADAMANT Node forging by Zabbix agent/adm.forging.status[{$ADM.FORGING.INSTANCE}],{$ADM.FORGING.NODATA})=1'
              name: 'ADAMANT: Forging status is unavailable'
              priority: AVERAGE
              description: 'Attach a dependency on the existing node-availability trigger.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 3bdbf4cfae6b4b99a4af5a8ac2b20011
          name: 'ADAMANT forging: State'
          type: DEPENDENT
          key: 'adm.forging.state[{$ADM.FORGING.INSTANCE}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.state
            - type: JAVASCRIPT
              parameters:
                - |
                  var states = {
                    loading: 0,
                    disabled: 1,
                    unlocked: 2,
                    partial: 3,
                    locked: 4
                  };
                  if (!Object.prototype.hasOwnProperty.call(states, value)) {
                    throw new Error('Unknown forging state: ' + value);
                  }
                  return states[value];
          master_item:
            key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          tags:
            - tag: component
              value: forging
          triggers:
            - uuid: 306cc0a6e5fb4b96bb35bfc4a5e60011
              expression: 'min(/ADAMANT Node forging by Zabbix agent/adm.forging.state[{$ADM.FORGING.INSTANCE}],{$ADM.FORGING.LOCKED.MAX})>=3 and last(/ADAMANT Node forging by Zabbix agent/adm.forging.encrypted[{$ADM.FORGING.INSTANCE}])>0'
              name: 'ADAMANT: Forging is locked, operator unlock required'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
            - uuid: a74f2d5d1ebf4f7ba9b6fc8d6fa0011
              expression: 'min(/ADAMANT Node forging by Zabbix agent/adm.forging.state[{$ADM.FORGING.INSTANCE}],{$ADM.FORGING.LOADING.MAX})=0'
              name: 'ADAMANT: Node has remained loading or rebuilding for too long'
              priority: WARNING
              tags:
                - tag: scope
                  value: availability
        - uuid: 7bf9f8efbba54fe9ac742a84d1a90011
          name: 'ADAMANT forging: Encrypted delegates'
          type: DEPENDENT
          key: 'adm.forging.encrypted[{$ADM.FORGING.INSTANCE}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.encrypted
          master_item:
            key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          tags:
            - tag: component
              value: forging
        - uuid: d83e73edc9d84b72a43ad1b9c8ad0011
          name: 'ADAMANT forging: Loaded encrypted delegates'
          type: DEPENDENT
          key: 'adm.forging.encrypted-loaded[{$ADM.FORGING.INSTANCE}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.encryptedLoaded
          master_item:
            key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          tags:
            - tag: component
              value: forging
        - uuid: 28fd8d1b8b2b4a9ca23b3a73c8f60011
          name: 'ADAMANT forging: Plaintext delegates'
          type: DEPENDENT
          key: 'adm.forging.plaintext[{$ADM.FORGING.INSTANCE}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.plaintext
          master_item:
            key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          tags:
            - tag: component
              value: forging
          triggers:
            - uuid: 2e5f1d8d9ad44e1cae204ee6cba00011
              expression: 'last(/ADAMANT Node forging by Zabbix agent/adm.forging.plaintext[{$ADM.FORGING.INSTANCE}])>0'
              name: 'ADAMANT: Plaintext delegate passphrases are configured'
              priority: INFO
              status: DISABLED
              tags:
                - tag: scope
                  value: security
        - uuid: 4beed8ccdfde4af6b2eb1f4d4d720011
          name: 'ADAMANT forging: Invalid encrypted delegates'
          type: DEPENDENT
          key: 'adm.forging.invalid-encrypted[{$ADM.FORGING.INSTANCE}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.invalidEncrypted
          master_item:
            key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          tags:
            - tag: component
              value: forging
          triggers:
            - uuid: 35d1a1cf5f4c4d2ba5c5cc86c9a70011
              expression: 'last(/ADAMANT Node forging by Zabbix agent/adm.forging.invalid-encrypted[{$ADM.FORGING.INSTANCE}])>0'
              name: 'ADAMANT: Invalid encrypted delegate entries are configured'
              priority: WARNING
              tags:
                - tag: scope
                  value: security
        - uuid: d1e5c61fcf3d4b4c8c1cfe1bd4d90011
          name: 'ADAMANT forging: Loaded keypairs'
          type: DEPENDENT
          key: 'adm.forging.loaded-keypairs[{$ADM.FORGING.INSTANCE}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.loadedKeypairs
          master_item:
            key: 'adm.forging.status[{$ADM.FORGING.INSTANCE}]'
          tags:
            - tag: component
              value: forging
      macros:
        - macro: '{$ADM.FORGING.INSTANCE}'
          value: mainnet
        - macro: '{$ADM.FORGING.LOCKED.MAX}'
          value: 10m
        - macro: '{$ADM.FORGING.LOADING.MAX}'
          value: 6h
        - macro: '{$ADM.FORGING.NODATA}'
          value: 5m
