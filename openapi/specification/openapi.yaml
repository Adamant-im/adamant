    post:
      tags:
        - KVS
      operationId: postGetKVS
      description: >-
        Fetch data from KVS using a JSON request body (useful when query-string length limits are
        exceeded for large `keyIds` or `senderIds` lists). All filters combine with AND;
        `and:`-prefixed aliases are accepted while `or:` filters, unknown parameters, and
        conflicting plain/`and:` values are rejected.
