        Fetch data from KVS. Returns a list of transactions of `type = 9` with KVS data stored in
        `asset.state`. All filters combine with AND; `and:`-prefixed aliases are accepted while
        `or:` filters, unknown parameters, and conflicting plain/`and:` values are rejected.
      parameters:
        $ref: 'kvs/GetKVS/GetKVSParams.yaml'
      responses:
