openapi: 3.2.0

info:
  title: ADAMANT Node API
  description: |
    OpenAPI 3.2 specification for the [ADAMANT](https://adamant.im) Node API.

    ADAMANT is a decentralized messenger built on its own blockchain. This specification covers
    accounts, transactions, chats, delegates, blocks, nodes, and key-value storage endpoints.

    **Rate limits (`429 Too Many Requests`)**
    Public REST endpoints enforce per-IP aggregate (`all`) and route-class (`status`, `read`,
    `publish`) budgets. Exceeding a cap returns HTTP `429` with
    `{"success": false, "error": "..."}` (without `nodeTimestamp`), `Retry-After`, standard
    `RateLimit-*` headers (including `RateLimit-Scope`), and optional legacy `X-RateLimit-*`
    headers when configured. CORS middleware exposes these headers to browser clients. Treat
    `429` as temporary backpressure rather than a permanent validation error. Peer HTTP routes
    (`/peer/*`) use fixed status `429`, `RateLimit-Scope` (`status`, `sync`, `broadcast`, `all`),
    and mixed-version negotiation via `X-Adamant-Rate-Limit: 1`.

    **Useful links**
    - [ADAMANT Node](https://github.com/Adamant-im/adamant) — blockchain node implementation
    - [AIPs](https://aips.adamant.im) — ADAMANT Improvement Proposals
    - [API Docs](https://docs.adamant.im) — reference documentation
    - [OpenAPI JSON](schema.json) — bundled specification
    - [OpenAPI Source](https://github.com/Adamant-im/adamant/tree/dev/openapi) — source of this specification
  version: 0.11.0

servers:
  - url: https://lake.adamant.im/api
    description: Mainnet Lake
  - url: https://debate.adamant.im/api
    description: Mainnet Debate
  - url: https://bid.adamant.im/api
