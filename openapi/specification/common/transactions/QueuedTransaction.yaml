required:
  - recipientId
  - amount
  - type
  - senderId
  - senderPublicKey
  - timestamp
  - signature
  - id
  - fee
  - relays
  - receivedAt
  - blockId
  - height
  - confirmations
properties:
  recipientId:
    type: string
    example: U14236667426471084862
  amount:
    type: integer
    example: 0
  type:
    type: integer
    minimum: 0
    maximum: 9
    example: 3
    description: See [Transaction Types](https://docs.adamant.im/api-types/transaction-types.html)
  senderId:
    type: string
    example: U14236667426471084862
  senderPublicKey:
    type: string
    example: 8cd9631f9f634a361ea3b85cbd0df882633e39e7d26d7bc615bbcf75e41524ef
  timestamp:
    type: integer
    example: 63394407
  timestampMs:
    type: [integer, 'null']
    example: 63394407123
    description: Optional transaction time measured in milliseconds since the ADAMANT epoch. Available for transactions that include it; for consensus-sensitive blockchain storage it works after the `spaceship` activation. When present, it belongs to the same second as `timestamp`.
  signature:
    type: string
    example: 7f4f5d240fc66da1cbdb3fe291d6fcec006848236355aebe346fcd1e3ba500caeac1ed0af6f3d7f912a889a1bbedc1d7bab17b6ebd36386b81df78189ddf7c07
  id:
    type: string
    example: '13616514419605573351'
  fee:
    type: integer
    example: 5000000000
  relays:
    type: integer
    example: 1
  receivedAt:
    type: string
    description: Date and time in ISO 8601 format
    example: 2019-09-06T10:33:28.054Z
  blockId:
    type: 'null'
    const: null
  height:
    type: 'null'
    const: null
  confirmations:
    type: number
    const: 0
